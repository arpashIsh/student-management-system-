<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #a3ffbc;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #000;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        nav {
            margin: 1rem;
            text-align: center;
        }
        nav button {
            margin: 0 1rem;
            padding: 0.5rem 1rem;
            font-size: 1rem;
            cursor: pointer;
            background-color: black;
            color: white;
            border: none;
            border-radius: 4px;
        }
        nav button:hover {
            background-color: #333;
        }
        main {
            margin: 2rem auto;
            max-width: 900px;
            padding: 1rem;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px #ccc;
        }
    </style>
</head>
<body>
    <header>
        <h1>Student Management System</h1>
    </header>
    <nav>
        <button id="btnAdd">Add Employee</button>
        <button id="btnView">View Employees</button>
        <button id="btnUpdate">Update Employee</button>
        <button id="btnRemove">Remove Employee</button>
    </nav>
    <main id="mainContent">
        <p>Welcome to the Student Management System. Use the buttons above to manage employees.</p>
    </main>
    <script src="app.js"></script>
</body>
</html>
